name: verify-public-path

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # daily drift check: the live site must keep matching what we document
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify documented public path
        run: bash scripts/verify-public-path.sh
        env:
          DOCS_URL: https://docs.valorbrain.com.br
          REST_URL: https://valorbrain-api.valor.digital
          # Daily: the docs spec must have the engine's public path set.
          SPEC_PARITY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      # Live site: run on the daily schedule (a push to main lands before the
      # manual deploy, so the live host lags the commit by minutes).
      - name: Live link checker
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-links.py https://docs.valorbrain.com.br
      - name: Live credential matrix equals the committed snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-credential-matrix.py --live
      - name: Live origin edge
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/check-edge.sh https://docs.valorbrain.com.br
      - name: Live CLI version is the npm latest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-cli-version.py https://docs.valorbrain.com.br
