name: docs-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          bun install --frozen-lockfile
          python3 -m pip install --quiet pyyaml
      # prebuild regenerates the reference pages (live engine spec, help --json
      # of the npm `latest` CLI); engine sources are absent here, so the
      # committed MCP catalog page is kept.
      - name: Build
        run: bun run build
      # The credential pages are generated from the engine's credential matrix;
      # a hand edit or a stale regeneration fails here. The live comparison
      # (--live) runs daily in verify-public-path.
      - name: Credential pages match the credential matrix
        run: python3 scripts/check-credential-matrix.py
      - name: One published tool count
        run: python3 scripts/check-tool-count.py
      - name: CLI version in the docs is the npm latest
        run: python3 scripts/check-cli-version.py
      - name: Start
        run: |
          bun run start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3012/docs && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1
      - name: Link checker (0 broken links, every page has a .md twin and a 200 sitemap entry)
        run: python3 scripts/check-links.py http://127.0.0.1:3012
      - name: Markdown twin survives the tunnel's X-Forwarded-Proto
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3012/docs/quickstart.md)
          [ "$code" = 200 ] || { echo "quickstart.md behind https proxy: $code"; cat /tmp/next.log; exit 1; }
      - name: Origin edge (redirect + headers)
        run: bash scripts/check-edge.sh http://127.0.0.1:3012

  # The committed pages generated from the engine (the error catalog and the
  # other credential pages, the MCP catalog, public/mcp-schemas.md) must equal
  # what the engine's main produces now. The build above keeps the committed
  # copies because it has no engine; this job has one. The engine repo is
  # private: read-only deploy key in ENGINE_DEPLOY_KEY. Fork PRs get no
  # secrets, so the job is skipped there and runs on the merge to main.
  engine-reference:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Engine sources (agentxagi/valorbrain main, src/ only)
        uses: actions/checkout@v4
        with:
          repository: agentxagi/valorbrain
          ref: main
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
          sparse-checkout: src
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      # No `bun install` here on purpose: with no node_modules above engine/,
      # bun auto-installs the one package the engine renderer imports (yaml),
      # at the version in the engine's package.json.
      - name: Install
        run: python3 -m pip install --quiet pyyaml
      - name: Committed engine pages match the engine
        run: python3 scripts/generate-reference.py --check
        env:
          VALORBRAIN_ENGINE: ${{ github.workspace }}/engine
