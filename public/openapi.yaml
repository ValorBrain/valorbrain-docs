      description: 'Hero numbers (searches served, contexts delivered, memories recorded),
        usage families, quality coverage (sessions with declared memory_used over
        sessions with delivered context), active agents, knowledge timeline and per-operation
        breakdown. Completed days are served from the pre-computed value_daily table;
        the current day aggregates live; days the nightly job missed fall back to
        live aggregation and are reported in stale_days. Infra agents excluded from
        every family.

        '
      tags:
      - Observability
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - today
          - yesterday
          - 7d
          - 30d
          default: 7d
        description: Window (UTC days); yesterday is the closed digest day
      responses:
        '200':
          description: Value summary
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
