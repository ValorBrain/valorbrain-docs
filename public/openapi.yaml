servers:
- url: https://valorbrain-api.valor.digital
  description: Hosted engine REST
- url: http://localhost:7438
  description: Local engine (self-hosted)
security:
- bearerAuth: []
tags:
- name: Health
  description: Liveness, readiness, and system diagnostics
- name: Documents
  description: Document CRUD, ingest, and mutations
- name: Search
  description: Hybrid search, temporal, hierarchical, and retrieve
- name: Ask
  description: RAG chat with LLM answer and source citations
- name: Graph
  description: Causal links, similarity, and memory evolution
- name: Entity
  description: Entity cards and SPO triples
- name: Foundations
  description: Knowledge OS Tier-0 context and foundation management
- name: Agents
  description: Agent signup, identify, claim, and verify
- name: Workspace
  description: 'Cross-agent workspace: focus, sessions, handoffs'
- name: Users
  description: User management
- name: Identity
  description: Agent/user identity profile
- name: Billing
  description: Credits, pricing, subscriptions, and plans
- name: Admin
  description: Tenant management, error logging (requires ENGINE_ADMIN_SECRET)
- name: OAuth
  description: OAuth 2.1 authorization server and protected resource
- name: MCP Tokens
  description: MCP API token CRUD
- name: Observability
  description: Metrics, traces, ROI, and feature flags
- name: Canonical
  description: Canonical tracking, conflicts, proposals, and probes
- name: Lifecycle
  description: 'Document lifecycle: status, sweep, restore'
- name: Maintenance
  description: Reindex, graph build, and collection settings
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Public liveness probe
      description: Returns 200 if the process is up. No auth, no store dependency.
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                - timestamp
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /health:
    get:
      operationId: health
      summary: Health check with database status
      description: Returns service status, document counts, vector index state, and
        request context.
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: string
                  database:
                    type: string
                  documents:
                    type: integer
                  needsEmbedding:
                    type: integer
                  hasVectors:
                    type: boolean
                  request:
                    $ref: '#/components/schemas/RequestContext'
  /health/deep:
    get:
      operationId: healthDeep
      summary: Deep health check with per-component probes
      description: Probes database, documents, LLM config, and embed worker. Used
        by uptime monitors.
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Component-level health
          content:
            application/json:
              schema:
                type: object
                required:
                - checks
                properties:
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                      - ok
                      properties:
                        ok:
                          type: boolean
                        latency_ms:
                          type: integer
                        detail:
                          type: string
                        error:
                          type: string
                  latency_ms:
                    type: integer
  /state:
    get:
      operationId: state
      summary: Engine state summary
      tags:
      - Health
      responses:
        '200':
          description: State object
          content:
            application/json:
              schema:
                type: object
  /stats:
    get:
      operationId: stats
      summary: Index statistics and health
      tags:
      - Health
      responses:
        '200':
          description: Stats including document counts, collections, and health
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: integer
                  totalDocuments:
                    type: integer
                  needsEmbedding:
                    type: integer
                  collections:
                    type: array
                    items:
                      type: object
                  health:
                    type: object
  /reports/memory:
    get:
      operationId: reportsMemory
      summary: Memory usage report
      description: Tenant-scoped memory report. Requires X-Tenant-ID.
      tags:
      - Health
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Memory report
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
  /documents:
    post:
      operationId: ingestDocument
      summary: Ingest a document
      description: 'Create or update a document in a collection. Supports quality
        gate evaluation, schema packs, auto-linking, and temporal metadata. Requires
        X-Tenant-ID.

        '
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - collection
              - path
              - content
              properties:
                collection:
                  type: string
                  description: Collection name
                path:
                  type: string
                  description: Unique document path within the collection
                title:
                  type: string
                content:
                  type: string
                  maxLength: 1000000
                  description: Document body (max 1MB)
                content_type:
                  type: string
                  default: note
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.5
                quality_score:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.5
                metadata:
                  type: object
                  additionalProperties: true
                user_id:
                  type: string
                run_id:
                  type: string
                event_at:
                  type: string
                  format: date-time
                event_type:
                  type: string
      responses:
        '200':
          description: Document ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  path:
                    type: string
                  hash:
                    type: string
                  embed_state:
                    type: string
                  gate_verdict:
                    type: object
                    properties:
                      shouldIndex:
                        type: boolean
                      reason:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: listDocuments
      summary: List documents
      description: List documents with optional filtering by collection.
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: collection
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}:
    get:
      operationId: getDocument
      summary: Get a document by ID or hash
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Document ID or hash
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{id}/visibility:
    patch:
      operationId: patchDocumentVisibility
      summary: Update document visibility
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - visibility
              properties:
                visibility:
                  type: string
      responses:
        '200':
          description: Visibility updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{id}/pin:
    post:
      operationId: pinDocument
      summary: Pin a document for permanent prioritization
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Document pinned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}/snooze:
    post:
      operationId: snoozeDocument
      summary: Temporarily hide a document from context
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Document snoozed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}/forget:
    post:
      operationId: forgetDocument
      summary: Permanently deactivate a document
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Document forgotten
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}/feedback:
    post:
      operationId: documentFeedback
      summary: Submit relevance feedback for a document
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - relevance
              properties:
                relevance:
                  type: string
                  enum:
                  - positive
                  - negative
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/purge:
    delete:
      operationId: purgeDocuments
      summary: Purge documents by collection
      description: 'Delete all documents in a collection (exact or prefix match).
        Cleans up vectors, triples, and orphan records. Requires X-Tenant-ID.

        '
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: collection
        in: query
        schema:
          type: string
        description: Exact collection name
      - name: collection_prefix
        in: query
        schema:
          type: string
        description: Collection name prefix (LIKE match)
      responses:
        '200':
          description: Purge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged:
                    type: integer
                  orphan_vectors_cleaned:
                    type: integer
                  orphan_triples_cleaned:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/documents/{id}/canonical:
    post:
      operationId: setCanonical
      summary: Mark a document as canonical
      tags:
      - Canonical
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                canonical:
                  type: boolean
      responses:
        '200':
          description: Canonical status set
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/documents/{id}/suggest-filters:
    post:
      operationId: suggestFilters
      summary: Suggest retrieval filters for a document
      tags:
      - Canonical
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Suggested filters
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/documents/{id}/probes:
    post:
      operationId: registerProbe
      summary: Register a validation probe for a document
      tags:
      - Canonical
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Probe registered
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    post:
      operationId: search
      summary: Hybrid search (BM25 + vector + rerank)
      description: 'Full hybrid search with optional HyDE expansion, self-correct
        retrieval, MMR diversity, and personalized graph ranking.

        '
      tags:
      - Search
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - q
              properties:
                q:
                  type: string
                  description: Search query
                collection:
                  type: string
                  description: Filter to collection
                limit:
                  type: integer
                  default: 10
                offset:
                  type: integer
                  default: 0
                expand:
                  type: boolean
                  description: Force HyDE expansion on/off
                mode:
                  type: string
                  enum:
                  - auto
                  - keyword
                  - semantic
                  - causal
                  - hybrid
                diverse:
                  type: boolean
                  default: true
                  description: Apply MMR diversity filter
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  query:
                    type: string
                  mode:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search/temporal:
    post:
      operationId: temporalSearch
      summary: Temporal search with time-aware filtering
      tags:
      - Search
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - q
              properties:
                q:
                  type: string
                collection:
                  type: string
                limit:
                  type: integer
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Temporally filtered results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search/hierarchical:
    post:
      operationId: hierarchicalSearch
      summary: Hierarchical search across memory layers
      tags:
      - Search
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - q
              properties:
                q:
                  type: string
                limit:
                  type: integer
      responses:
        '200':
          description: Hierarchical results
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /retrieve:
    post:
      operationId: retrieve
      summary: Unified retrieval with auto-routing
      description: Auto-classifies query intent and routes to optimal search backend.
      tags:
      - Search
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - q
              properties:
                q:
                  type: string
                mode:
                  type: string
                  enum:
                  - auto
                  - keyword
                  - semantic
                  - causal
                  - timeline
                  - discovery
                  - complex
                  - hybrid
                limit:
                  type: integer
                collection:
                  type: string
      responses:
        '200':
          description: Retrieved results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  mode:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ask:
    post:
      operationId: ask
      summary: RAG chat with LLM answer and source citations
      description: 'Retrieve relevant context, run through LLM reasoning, and return
        a grounded answer with source citations. Supports streaming (SSE).

        '
      tags:
      - Ask
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - q
              properties:
                q:
                  type: string
                  description: User question
                collection:
                  type: string
                stream:
                  type: boolean
                  default: false
                  description: Enable SSE streaming
                language:
                  type: string
                  enum:
                  - pt-BR
                  - en
                  default: pt-BR
                limit:
                  type: integer
                  default: 5
                  description: Max source documents to retrieve
      responses:
        '200':
          description: 'RAG answer. When stream=false, returns JSON with answer and
            sources. When stream=true, returns text/event-stream.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  trace_id:
                    type: string
            text/event-stream:
              schema:
                type: string
                description: SSE stream of answer chunks
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/traces:
    get:
      operationId: listTraces
      summary: List recent ask traces
      tags:
      - Ask
      parameters:
      - name: limit
