          $ref: '#/components/responses/Forbidden'
  /api/v1/subscription/grant:
    post:
      operationId: grantSubscriptionCredits
      summary: Grant legacy Stripe invoice credits idempotently
      description: 'Compatibility endpoint for older Stripe contracts with monthly
        credits. Writes a credit_grant event with source stripe:invoice and source_id
        equal to invoice_id. It does not activate or change the subscription itself.

        '
      tags:
      - Billing
      security:
      - moneyAdminAuth: []
      parameters:
      - $ref: '#/components/parameters/MoneyTenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreditGrantRequest'
      responses:
        '200':
          description: Credits granted once, or an identical invoice replay skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCreditGrantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '422':
          $ref: '#/components/responses/BillingUnprocessable'
  /api/v1/billing/events/apply:
    post:
      operationId: applyBillingEvent
      summary: Apply a verified billing event idempotently
      description: 'Applies an externally verified billing effect in one tenant-scoped
        transaction. The tenant row is locked before replay lookup and before any
        subscription lock. Subscription events update entitlement/quota; credit_grant
        updates only balance and ledger and returns subscription null. Older periods
        are journaled as immutable stale no-ops. The final non-null result is inserted
        once with the event after all effects are built; a global source-key or settlement-proof
        conflict rolls back every effect. Payment verification and private signing
        material stay outside this API.

        '
      tags:
      - Billing
      security:
      - moneyAdminAuth: []
      parameters:
      - $ref: '#/components/parameters/MoneyTenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingEventApplyRequest'
      responses:
        '200':
          description: Event applied once or returned as an identical replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingEventApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BillingConflict'
        '422':
          $ref: '#/components/responses/BillingUnprocessable'
  /api/v1/billing/events:
    get:
      operationId: findBillingEvents
      summary: Find tenant billing events for reconciliation
      description: 'Admin-only, tenant-scoped journal lookup. Supply event_id, the
        complete source/source_id pair, or provider_subscription_id. Combined selectors
        use AND. Results are ordered by created_at descending and never expose another
        tenant''s event.

        '
      tags:
      - Billing
      security:
      - moneyAdminAuth: []
      parameters:
      - $ref: '#/components/parameters/MoneyTenantIdHeader'
      - name: event_id
        in: query
        schema:
          type: string
          format: uuid
      - name: source
        in: query
        description: Must be supplied together with source_id.
        schema:
          type: string
          maxLength: 128
      - name: source_id
        in: query
        description: Must be supplied together with source.
        schema:
          type: string
          maxLength: 512
      - name: provider_subscription_id
        in: query
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Matching tenant billing events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
