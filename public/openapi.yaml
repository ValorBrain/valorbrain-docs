components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: VALORBRAIN_API_TOKEN or shadow tenant API key (vb_*)
    adminSecret:
      type: apiKey
      in: header
      name: Authorization
      description: ENGINE_ADMIN_SECRET as Bearer token
    moneyAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: VALORBRAIN_API_TOKEN or ENGINE_ADMIN_SECRET
      description: 'Money-route credential. Accepts the engine master token or ENGINE_ADMIN_SECRET.
        Tenant API and MCP persona tokens are rejected.

        '
  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: false
      description: 'Tenant UUID for multi-tenant operations. Required when VALORBRAIN_DEFAULT_TENANT_ID
        is not set. Some endpoints (like ingest) always require it.

        '
      schema:
        type: string
        format: uuid
    MoneyTenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: 'Explicit target tenant UUID for a money operation. The tenant
        is never accepted from the JSON body.

        '
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions (admin required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BillingConflict:
      description: 'Source idempotency, settlement proof, provider identity, or subscription
        period/state conflict. Cross-tenant ownership is never disclosed.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingEventErrorResponse'
    BillingUnprocessable:
      description: Recognized billing event that cannot be applied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingEventErrorResponse'
  schemas:
    Document:
      type: object
      properties:
        id:
          type: integer
          description: Internal document ID
        hash:
          type: string
          description: Content hash (SHA-256)
        collection:
          type: string
        path:
          type: string
        title:
          type: string
        content_type:
          type: string
        page_type:
          type: string
        visibility:
          type: string
          enum:
          - private
          - tenant
          - public
        embed_state:
          type: string
          enum:
          - pending
          - indexed
          - skipped
          - error
        is_pinned:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SearchResult:
      type: object
      properties:
        docid:
          type: string
        filepath:
          type: string
        title:
          type: string
        score:
          type: number
        snippet:
          type: string
        body:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CreditBalance:
      type: object
      properties:
        balance:
          type: number
        currency:
          type: string
    RequestContext:
      type: object
      properties:
        tenantId:
          type: string
          nullable: true
        sourceAgent:
          type: string
          nullable: true
        sourceSystem:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
    BillingEventKind:
      type: string
      enum:
      - subscription_activation
      - subscription_renewal
      - subscription_payment_failed
      - subscription_cancelled
      - credit_grant
      - refund
      - reversal
    BillingEventApplyRequest:
      type: object
      additionalProperties: false
      required:
      - source
      - source_id
      - event_kind
      description: 'All four subscription events require provider_subscription_id,
        period_start, and period_end. Activation and renewal additionally require
        plan_id and the complete settlement bundle. Their paid period is compared
        by PostgreSQL without JavaScript timestamp rounding. credit_amount must be
        zero for every event except credit_grant, where it must be positive. Refund
        and reversal are recognized but return unsupported_billing_event (422).

        '
      allOf:
      - oneOf:
        - properties:
            period_start:
              type: 'null'
            period_end:
              type: 'null'
        - required:
          - period_start
          - period_end
          properties:
            period_start:
              type: string
              format: date-time
            period_end:
              type: string
              format: date-time
      - oneOf:
        - properties:
            settlement_asset:
              type: 'null'
            settlement_network:
              type: 'null'
            settlement_amount_atomic:
              type: 'null'
            settlement_decimals:
              type: 'null'
            settlement_reference:
              type: 'null'
        - required:
          - settlement_asset
          - settlement_network
          - settlement_amount_atomic
          - settlement_decimals
          - settlement_reference
          properties:
            settlement_asset:
              type: string
              minLength: 1
            settlement_network:
              type: string
              minLength: 1
            settlement_amount_atomic:
              oneOf:
              - type: string
                pattern: ^[0-9]{1,38}$
              - type: integer
                minimum: 0
                maximum: 9007199254740991
            settlement_decimals:
              type: integer
              minimum: 0
              maximum: 18
            settlement_reference:
              type: string
              minLength: 1
      - if:
          properties:
            event_kind:
              enum:
              - subscription_activation
              - subscription_renewal
              - subscription_payment_failed
              - subscription_cancelled
          required:
          - event_kind
        then:
          required:
          - provider_subscription_id
          - period_start
          - period_end
          properties:
            provider_subscription_id:
              type: string
              minLength: 1
            period_start:
              type: string
              format: date-time
            period_end:
              type: string
              format: date-time
      - if:
          properties:
            event_kind:
              enum:
              - subscription_activation
              - subscription_renewal
          required:
          - event_kind
        then:
          required:
          - plan_id
          - settlement_asset
          - settlement_network
          - settlement_amount_atomic
          - settlement_decimals
          - settlement_reference
          properties:
            plan_id:
              type: string
              minLength: 1
            settlement_asset:
              type: string
              minLength: 1
            settlement_network:
              type: string
              minLength: 1
            settlement_amount_atomic:
              oneOf:
              - type: string
                pattern: ^[0-9]{1,38}$
              - type: integer
                minimum: 0
                maximum: 9007199254740991
            settlement_decimals:
              type: integer
              minimum: 0
              maximum: 18
            settlement_reference:
              type: string
              minLength: 1
      - if:
          properties:
            event_kind:
              const: credit_grant
          required:
          - event_kind
        then:
          required:
          - credit_amount
          properties:
            credit_amount:
              type: number
              exclusiveMinimum: 0
        else:
          properties:
            credit_amount:
              type: number
              maximum: 0
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9:_-]+$
          description: 'Provider-qualified source. Subscription events use stripe:*,
            solana:mpp:*, or manual_contract:*.

            '
        source_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Globally stable provider event identity.
        event_kind:
          $ref: '#/components/schemas/BillingEventKind'
        plan_id:
          type:
          - string
          - 'null'
          maxLength: 64
        provider_subscription_id:
          type:
          - string
          - 'null'
          maxLength: 512
        period_start:
          type:
          - string
          - 'null'
          format: date-time
          description: 'RFC3339 with an explicit timezone. Original text is preserved
            in canonical hashing and final event results.

            '
        period_end:
          type:
          - string
          - 'null'
          format: date-time
          description: 'RFC3339 with an explicit timezone and later than period_start.

            '
        settlement_asset:
          type:
          - string
          - 'null'
          maxLength: 16
          description: Normalized to uppercase.
        settlement_network:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Normalized to lowercase before hashing and proof uniqueness
            checks.
        settlement_amount_atomic:
          oneOf:
          - type: string
            pattern: ^[0-9]{1,38}$
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        settlement_decimals:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 18
        settlement_reference:
          type:
          - string
          - 'null'
          maxLength: 512
          description: 'Globally unique together with lowercase settlement_network
            when present, regardless of source or tenant.

            '
        credit_amount:
          type: number
          minimum: 0
          maximum: 1000000000
          multipleOf: 1.0e-08
          default: 0
        provider_metadata:
          type: object
          additionalProperties: true
          description: 'Small public provider references only. Secret, private, credential,
            token, mandate, authorization, and signature keys are rejected.

            '
        metadata:
          type: object
          additionalProperties: true
          description: 'Non-sensitive metadata copied to the credit ledger when applicable.
            The same secret/private/token/mandate/signature key filter applies.

            '
    BillingSubscriptionSnapshot:
      type: object
      required:
      - plan_id
      - status
      - billing_provider
      - provider_subscription_id
      - current_period_start
      - current_period_end
      - grace_until
      properties:
        plan_id:
          type: string
        status:
          type: string
          enum:
          - free
          - incomplete
          - active
          - past_due
          - cancelled
          - expired
        billing_provider:
          type:
          - string
          - 'null'
          enum:
          - stripe
          - solana_mpp
          - manual_contract
          - null
        provider_subscription_id:
          type:
          - string
          - 'null'
        current_period_start:
          type:
          - string
          - 'null'
          format: date-time
        current_period_end:
          type:
          - string
          - 'null'
          format: date-time
        grace_until:
          type:
          - string
          - 'null'
          format: date-time
    BillingCreditResult:
      type: object
      required:
      - granted
      - balance_after
      properties:
        granted:
          type: number
        balance_after:
          type: number
    BillingEventApplyResult:
      type: object
      required:
      - event_id
      - applied
      - replay
      - subscription
      description: 'Subscription is null for pure credit_grant events. Ignored events
        keep applied false and include a stable ignored_reason. An identical source
        replay sets replay true and applied false while preserving the stored subscription,
        credit, ignored_reason, and event id.

        '
      properties:
        event_id:
          type: string
          format: uuid
        applied:
          type: boolean
        replay:
          type: boolean
        subscription:
          oneOf:
          - $ref: '#/components/schemas/BillingSubscriptionSnapshot'
          - type: 'null'
        ignored_reason:
          type: string
          enum:
          - stale_period
          - subscription_cancelled
          - grace_elapsed
        credit:
          $ref: '#/components/schemas/BillingCreditResult'
    BillingEventRecord:
      type: object
      required:
      - id
      - tenant_id
      - source
      - source_id
      - event_kind
      - request_hash
      - credit_amount
      - result
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        source:
          type: string
        source_id:
          type: string
        event_kind:
          $ref: '#/components/schemas/BillingEventKind'
        request_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        plan_id:
          type:
          - string
          - 'null'
        provider_subscription_id:
          type:
          - string
          - 'null'
        period_start:
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          type:
          - string
          - 'null'
          format: date-time
        settlement_asset:
          type:
          - string
          - 'null'
        settlement_network:
          type:
          - string
          - 'null'
          description: Lowercase canonical network identifier.
        settlement_amount_atomic:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+$
        settlement_decimals:
          type:
          - integer
          - 'null'
        settlement_reference:
          type:
          - string
          - 'null'
        credit_amount:
          type: string
          description: PostgreSQL numeric serialized without precision loss.
        result:
          $ref: '#/components/schemas/BillingEventApplyResult'
        created_at:
          type: string
          format: date-time
    BillingEventsResponse:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/BillingEventRecord'
    SubscriptionCreditGrantRequest:
      type: object
      additionalProperties: false
      required:
      - invoice_id
      - subscription_id
      - plan_id
      - amount
      description: 'Legacy Stripe invoice credit. It is journaled as credit_grant
        and never creates, reads, or mutates tenant_subscriptions.

        '
      properties:
        invoice_id:
          type: string
          minLength: 1
          maxLength: 512
        subscription_id:
          type: string
          minLength: 1
          maxLength: 512
        plan_id:
          type: string
          minLength: 1
          maxLength: 64
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          multipleOf: 1.0e-08
        period_start:
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          type:
          - string
          - 'null'
          format: date-time
    SubscriptionCreditGrantResponse:
      type: object
      required:
      - ok
      - balance_after
      - granted
      properties:
        ok:
          type: boolean
          enum:
          - true
        balance_after:
          type: number
          description: Zero on an identical legacy invoice replay.
        granted:
          type: number
          description: Zero on an identical legacy invoice replay.
        idempotent_skip:
          type: boolean
    BillingEventErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: 'Includes idempotency_conflict, settlement_proof_conflict,
            subscription_provider_conflict, subscription_period_conflict, invalid_subscription_transition,
            and unsupported_billing_event.

            '
        message:
          type: string
          description: Present for validation errors; omitted for conflicts and higher
            statuses.
